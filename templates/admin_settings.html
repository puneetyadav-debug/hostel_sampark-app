{% extends "base.html" %}

{% block title %}Admin settings · Hostel Sampark{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl space-y-6">
    <div class="content-card rounded-2xl border p-6 sm:p-8">
        <h1 class="display-title text-2xl font-bold">Admin settings</h1>
        <p class="mt-2 text-sm text-slate-600">
            Change the hostel list and message shown to visitors.
        </p>

        <form action="{{ url_for('admin_settings') }}" method="POST" class="mt-6 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="hostels" class="block text-sm font-semibold">Hostels</label>
                <input
                    id="hostels"
                    name="hostels"
                    type="text"
                    value="{{ settings.hostels }}"
                    required
                    class="mt-1 w-full rounded-lg border p-3"
                >
                <p class="mt-1 text-xs text-slate-500">
                    Separate hostel names with commas.
                </p>
            </div>

            <div>
                <label for="announcement" class="block text-sm font-semibold">Announcement</label>
                <textarea
                    id="announcement"
                    name="announcement"
                    rows="3"
                    required
                    class="mt-1 w-full rounded-lg border p-3"
                >{{ settings.announcement }}</textarea>
            </div>

            <div>
                <label for="portal_open" class="block text-sm font-semibold">Portal status</label>
                <select
                    id="portal_open"
                    name="portal_open"
                    class="mt-1 w-full rounded-lg border p-3"
                >
                    <option value="true" {% if settings.portal_open == "true" %}selected{% endif %}>
                        Open
                    </option>
                    <option value="false" {% if settings.portal_open == "false" %}selected{% endif %}>
                        Closed
                    </option>
                </select>
            </div>

            <div class="flex flex-wrap gap-3">
                <button type="submit" class="button-primary rounded-xl px-5 py-3 text-sm font-semibold">
                    Save changes
                </button>
                <a href="{{ url_for('admin') }}" class="button-secondary rounded-xl px-5 py-3 text-sm font-semibold">
                    Back to dashboard
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
