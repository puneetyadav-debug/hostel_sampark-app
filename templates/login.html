{% extends "base.html" %}

{% block title %}Admin Login - Hostel Portal{% endblock %}

{% block content %}
<div class="bg-white p-6 sm:p-8 rounded-lg shadow-sm border border-gray-200 max-w-md mx-auto">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Admin Login</h2>
    <p class="text-sm text-gray-600 mb-6">Sign in to manage student grievances and update status records.</p>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" id="username" name="username" required
                class="block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500 text-sm">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                class="block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500 text-sm">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-md shadow-sm text-sm transition">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
