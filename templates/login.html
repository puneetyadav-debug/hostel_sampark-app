{% extends "base.html" %}

{% block title %}Admin Login · Hostel Sampark{% endblock %}

{% block content %}
<div class="content-card login-card mx-auto max-w-md rounded-2xl border p-6 shadow-xl sm:p-8">
    <p class="text-xs font-bold uppercase tracking-[0.18em] text-indigo-600">Staff access</p>
    <h1 class="display-title mt-2 text-2xl font-bold tracking-tight">Admin sign in</h1>
    <p class="mb-6 mt-2 text-sm leading-6 text-slate-600">Sign in to review grievances and update their status.</p>

    <form action="/admin-login" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="username" class="field-label mb-1 block text-sm font-medium">Username</label>
            <input type="text" id="username" name="username" required
                autocomplete="username" class="text-field block w-full rounded-lg border p-3 text-sm shadow-sm focus:outline-none focus:ring-4">
        </div>

        <div>
            <label for="password" class="field-label mb-1 block text-sm font-medium">Password</label>
            <input type="password" id="password" name="password" required
                autocomplete="current-password" class="text-field block w-full rounded-lg border p-3 text-sm shadow-sm focus:outline-none focus:ring-4">
        </div>

        <button type="submit" class="button-primary w-full rounded-lg px-4 py-3 text-sm font-semibold shadow-sm transition focus:outline-none focus:ring-4">
            Sign in to admin dashboard
        </button>
    </form>
    <a href="{{ url_for('submit_grievance') }}" class="mt-5 block text-center text-sm font-medium text-slate-500 hover:text-indigo-700">Back to submission page</a>
</div>
{% endblock %}
